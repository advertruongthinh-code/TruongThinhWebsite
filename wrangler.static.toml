# Top level = staging (preview): auto-deployed by CI after each merge to main, behind Cloudflare Access, noindex header.
# [env.production] = the live site, deployed only by the manual "Release site" workflow (docs/specs/static-release.md R11).
name = "truong-thinh-staging"
main = "src/search/worker.mjs"
compatibility_date = "2026-07-31"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "staging.truongthinhads.vn"
custom_domain = true

[assets]
directory = ".site-output"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[ratelimits]]
name = "SEARCH_TEXT_LIMIT"
namespace_id = "7303"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "SEARCH_IMAGE_LIMIT"
namespace_id = "7304"
simple = { limit = 10, period = 60 }

[observability]
enabled = false

# The live Worker was renamed from "truong-thinh-demo"; the apex custom domain must be moved to it
# once, in the dashboard, right after the first release (docs/specs/static-release.md R11).
# Rate-limit counters are keyed by namespace_id, so they survive the rename.
# Bindings are not inherited by environments.
[env.production]
name = "truong-thinh-site"
workers_dev = false
preview_urls = false

[[env.production.routes]]
pattern = "truongthinhads.vn"
custom_domain = true

[env.production.ai]
binding = "AI"

[[env.production.ratelimits]]
name = "SEARCH_TEXT_LIMIT"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "SEARCH_IMAGE_LIMIT"
namespace_id = "7302"
simple = { limit = 10, period = 60 }
