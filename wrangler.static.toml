# Static demo hosting: assets plus a small script that runs only for /api/*
# (see docs/specs/advertising-search.md).
# The CMS Worker config in wrangler.toml stays dormant until the CMS phase.
name = "truong-thinh-demo"
main = "src/search/worker.mjs"
compatibility_date = "2026-07-31"
workers_dev = true

# Production hostname (zone on Cloudflare, nameservers moved from Sapo); workers.dev stays on as the preview URL.
# www redirects to this host through a zone Redirect Rule, see docs/specs/static-release.md R11.
[[routes]]
pattern = "truongthinhads.vn"
custom_domain = true

[assets]
directory = ".site-output"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[ratelimits]]
name = "SEARCH_TEXT_LIMIT"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "SEARCH_IMAGE_LIMIT"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

[observability]
enabled = false
