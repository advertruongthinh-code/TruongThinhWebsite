# Local CMS run: use only with `pnpm cms:dev`, never deploy this file.
# D1 and R2 are emulated in `.wrangler/`, no real Cloudflare resources.
name = "truong-thinh-cms-local"
main = "../../src/worker/index.js"
compatibility_date = "2026-07-31"

[assets]
directory = "../../.admin-output"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "truong-thinh-cms-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../src/db/migrations"

[[r2_buckets]]
binding = "MEDIA_ORIGINALS"
bucket_name = "truong-thinh-media-originals-local"

[[r2_buckets]]
binding = "MEDIA_PUBLIC"
bucket_name = "truong-thinh-media-public-local"

[[ratelimits]]
name = "ADMIN_WRITE_LIMIT"
namespace_id = "7311"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ADMIN_UPLOAD_LIMIT"
namespace_id = "7312"
simple = { limit = 20, period = 60 }

[vars]
# Dev admin login: the Worker accepts it only when the host is loopback (R5).
CMS_LOCAL_ADMIN_EMAIL = "admin@localhost"
STAGING_ORIGIN_PUBLIC = "https://staging.truongthinhads.vn"
