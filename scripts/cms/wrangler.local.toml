# Local CMS run: use only with `pnpm cms:dev`, never deploy this file.
# D1 and R2 are emulated in `.wrangler/`, no real Cloudflare resources.
name = "truong-thinh-cms-local"
main = "../../src/worker/index.js"
compatibility_date = "2026-07-31"

[assets]
directory = "../../.site-output"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [
  "/",
  "/index.html",
  "/vi",
  "/vi/*",
  "/en",
  "/en/*",
  "/nha-o*",
  "/kinh-doanh*",
  "/quang-cao*",
  "/gioi-thieu*",
  "/residential*",
  "/commercial*",
  "/advertising-products*",
  "/projects-products*",
  "/about*",
  "/api/*",
  "/media/*",
  "/robots.txt",
  "/sitemap.xml",
]

[[d1_databases]]
binding = "DB"
database_name = "truong-thinh-cms-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../src/db/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "truong-thinh-media-local"

[vars]
# Dev admin login: the Worker accepts it only when the host is loopback (R5).
CMS_LOCAL_ADMIN_EMAIL = "admin@localhost"
