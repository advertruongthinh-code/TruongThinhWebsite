<header class="site-header" data-site-header>
  <a
    id="header-logo"
    class="brand"
    href="/"
    aria-label="TRƯỜNG THỊNH NỘI THẤT · QUẢNG CÁO — Trang chủ"
    data-en-aria-label="TRƯỜNG THỊNH INTERIORS · ADVERTISING — Home"
  >
    <svg class="brand-lockup" viewBox="0 25.4515 594 153.667" aria-hidden="true" data-parity-media>

  <g class="brand-lockup__geometry" fill="currentColor">
    <g class="brand-lockup__mark" transform="translate(0 25.4515) scale(0.62)">
      <path fill="var(--logo-mark-black, currentColor)" d="M253.13 190.58l33.07 57.27 -66.14 0c11.02,-19.09 22.05,-38.18 33.07,-57.27z" />
      <path fill="var(--logo-mark-yellow, currentColor)" d="M216.22 126.66l33.17 57.44c-12.27,21.25 -24.54,42.5 -36.81,63.75l-66.33 0c23.33,-40.4 46.65,-80.79 69.97,-121.19z" />
      <path fill="var(--logo-mark-magenta, currentColor)" d="M179.32 62.73l33.16 57.45c-24.57,42.55 -49.14,85.11 -73.71,127.67l-66.33 0c35.63,-61.7 71.25,-123.41 106.88,-185.12z" />
      <path fill="var(--logo-mark-cyan, currentColor)" d="M143.1 0l32.48 56.25c-36.88,63.87 -73.75,127.74 -110.62,191.6l-64.96 0 71.55 -123.92 71.55 -123.93z" />
    </g>
    <g class="brand-lockup__copy">
      <text class="brand-lockup__title" x="203.05517" y="98.47574" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="46.68365" font-weight="600" letter-spacing="0" word-spacing="0" textLength="390.63185" lengthAdjust="spacing">TRƯỜNG THỊNH</text>
      <text class="brand-lockup__subtitle" data-en="INTERIORS · ADVERTISING" x="201.57159" y="147.19920" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="28.85050" font-weight="600" letter-spacing="0" word-spacing="0" textLength="390.87000" lengthAdjust="spacing">NỘI THẤT · QUẢNG CÁO</text>
    </g>
  </g>

</svg>
    <span class="sr-only" data-en="{{logoEn}}">{{logoVi}}</span>
  </a>

  <nav
    id="header-menu-items"
    class="desktop-nav"
    aria-label="{{navVi}}"
    data-en-aria-label="{{navEn}}"
  >
    <!-- desktop-nav -->
  </nav>

  <button
    id="header-menu-toggle"
    class="menu-button"
    type="button"
    aria-label="Mở menu"
    data-en-aria-label="Open menu"
    aria-expanded="false"
    aria-controls="site-menu"
    data-menu-open
  >
    <svg id="header-toggle-svg" viewBox="0 0 35 19" aria-hidden="true">
      <line class="top" x1="0" y1="1.5" x2="35" y2="1.5" />
      <line class="middle" x1="8.75" y1="9.5" x2="26.25" y2="9.5" />
      <line class="bottom" x1="0" y1="17.5" x2="35" y2="17.5" />
    </svg>
  </button>
</header>
