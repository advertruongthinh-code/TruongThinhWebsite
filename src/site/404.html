<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Trang bạn tìm không còn ở đây hoặc đã chuyển sang địa chỉ mới."
      data-en-content="The page you are looking for does not exist or has moved."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <!-- shell:head -->
    <!-- shell:boot -->
    <title data-en="404 — Trường Thịnh">
      404 — Trường Thịnh
    </title>
    <!-- shell:styles -->
    <style>
      /* 404 page only: a large number and one centered line of text, following Espacio's 404 (no logo strip, owner 2026-10-12). */
      /* The page fits one screen exactly, no scrolling (owner 2026-10-12): the container is exactly 100svh tall, the footer sits at the bottom,
         the text group is centered in the remainder under the header; the 404 number shrinks with height so a short screen still fits.
         :not([hidden]) because Barba leave hides the old container with hidden; display flex overriding that would offset the next page's parallax. */
      [data-barba-namespace="not-found"]:not([hidden]) {
        display: flex;
        flex-direction: column;
        height: 100svh;
      }

      [data-barba-namespace="not-found"] main {
        display: grid;
        flex: 1;
        min-height: 0;
      }

      .not-found {
        display: grid;
        padding: calc(var(--header-row-height) + var(--gutter)) 20px var(--gutter);
        place-content: center;
        text-align: center;
      }

      .not-found h1 {
        margin: 0;
        font-size: clamp(4rem, min(30vw, 22svh), 10rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: var(--tracking-display);
      }

      .not-found p {
        margin: 2rem 0 0;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.4;
        text-transform: uppercase;
      }

      /* Text group like Espacio, frame-measured (owner 2026-10-12): the whole group zooms from 1.1 to 1 over 2.5s --ease from when the page starts to reveal;
         the sentence then the number fade in as whole blocks over 1s expo.out, delayed 0.3s and 0.6s, with no word splitting.
         Paused at the first frame under the veil, runs when the veil starts opening (body.is-transitioning) or when route-enter has been removed. */
      @media (scripting: enabled) and (prefers-reduced-motion: no-preference) {
        html:not(.motion-fallback) .not-found__copy {
          animation: not-found-zoom 2.5s var(--ease) both;
        }

        html:not(.motion-fallback) .not-found__copy > * {
          animation: not-found-fade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        html:not(.motion-fallback) .not-found__copy > p {
          animation-delay: 0.3s;
        }

        html.route-enter body:not(.is-transitioning) :is(.not-found__copy, .not-found__copy > *) {
          animation-play-state: paused;
        }
      }

      @keyframes not-found-zoom {
        from { transform: scale(1.1); }
      }

      @keyframes not-found-fade {
        from { opacity: 0; }
      }
    </style>
  </head>
  <body data-barba="wrapper">
    <!-- shell:route-veil -->

    <!-- shell:header -->

    <!-- TODO(owner): Replace this placeholder with the verified official Zalo URL. -->
    <!-- shell:floating-cta -->

    <div
      class="page-shell"
      data-scroll-container

      <main id="noi-dung">
        <section class="not-found" data-header-tone="ink" aria-labelledby="page-title">
          <div class="not-found__copy">
            <h1 id="page-title">404</h1>
            <p data-en="The page you were looking for is no longer here or has moved to a new address.">Trang bạn tìm không còn ở đây hoặc đã chuyển sang địa chỉ mới.</p>
          </div>
        </section>

      </main>

      <!-- shell:footer -->
    </div>

    <!-- shell:scripts -->
  </body>
</html>
