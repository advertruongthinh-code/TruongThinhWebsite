<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-en="{{titleEn}} | Trường Thịnh">{{titleVi}} | Trường Thịnh</title>
    <meta name="description" content="{{statementVi}}" data-en-content="{{statementEn}}" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/detail.css" />
  </head>
  <body>
    <main id="noi-dung">
      <article class="advertising-detail" data-header-tone="ink">
        <header class="advertising-detail__intro">
          <p class="detail-eyebrow" data-motion-fade data-en="ADVERTISING PRODUCTS">SẢN PHẨM QUẢNG CÁO</p>
          <h1 data-motion-lines>
            <span class="detail-line"><span data-motion-line-source data-en="{{titleEn}}">{{titleVi}}</span></span>
          </h1>
          <p class="advertising-detail__statement" data-motion-fade data-en="{{statementEn}}">{{statementVi}}</p>
        </header>

        <div class="advertising-detail__composition" data-advertising-layout="{{layoutKey}}">
          {{composition}}
        </div>

        <nav class="advertising-detail__actions section-gap" aria-label="Điều hướng sản phẩm" data-en-aria-label="Product navigation">
          <a class="story-link" href="/vi/advertising-products/" data-en="View all advertising products">Xem tất cả sản phẩm quảng cáo</a>
          <a class="story-link" href="#lien-he" data-en="Request a consultation">Yêu cầu tư vấn</a>
        </nav>
      </article>
    </main>
  </body>
</html>
