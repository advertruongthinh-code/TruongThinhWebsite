<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Công trình quảng cáo Trường Thịnh: khảo sát, tư vấn, sản xuất và lắp đặt kiosk, xe bán hàng, bảng hiệu và hộp đèn."
      data-en-content="Trường Thịnh advertising projects: survey, consultation, production and installation of kiosks, mobile retail carts, signage and light boxes."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- shell:head -->
    <!-- layout-cache-preload -->
    <!-- shell:boot -->
    <title data-en="Advertising products — Trường Thịnh">
      Sản phẩm Quảng cáo — Trường Thịnh
    </title>
    <!-- shell:styles -->
  </head>
  <body
    class="detail-page"
    data-detail-hero-profile="words-06"
    data-barba="wrapper"
  >
    <script>
      // Direct entry into detail (a card page or the old ?photo=): hide the grid before the first layout; catalog-runtime keeps or drops the class.
      if (/\/advertising-products\/p\/[^/]+\/$/.test(location.pathname) || new URLSearchParams(location.search).has("photo")) document.body.classList.add("is-detail");
    </script>
    <!-- shell:route-veil -->

    <!-- shell:header -->

    <!-- shell:floating-cta -->

    <!-- shell:menu -->

    <div
      class="page-shell"
      data-scroll-container
      data-barba="container"
      data-barba-namespace="advertising-products"
    >
      <main id="noi-dung">
        <section
          class="hero detail-hero detail-index-hero"
          id="top"
          data-header-tone="ink"
        >
          <div class="hero-content" data-motion-hero-wrapper-zoom>
            <p
              class="hero-kicker"
              data-cms="hero.kicker"
              data-motion-hero-kicker
              data-en="Our featured products"
            >
              Sản phẩm tiêu biểu
            </p>
            <h1 id="page-title" data-motion-words data-motion-hero-title>
              <span class="detail-hero-line-mask">
                <span
                  class="detail-title__quiet"
                  data-motion-word-source
                  data-en="Keep your brand"
                >
                  để thương hiệu
                </span>
              </span>
              <span class="detail-hero-line-mask">
                <span
                  class="detail-title__strong"
                  data-motion-word-source
                  data-en="always in sight"
                >
                  luôn trong tầm mắt
                </span>
              </span>
            </h1>
          </div>

          <div class="hero-browse">
            <div
              class="project-filters"
              role="group"
              aria-label="Lọc công trình theo loại"
              data-en-aria-label="Filter projects by type"
            >
              <a class="project-filter" href="/vi/advertising-products/" data-masonry-filter="all" aria-current="true" data-en="All">Tất cả</a>
              <!-- advertising-cluster-filters -->
            </div>
            <!-- advertising-product-chips -->
          </div>

          <button
            class="scroll-cue detail-index-hero__scroll"
            type="button"
            data-scroll-cue
            aria-label="Cuộn đến phần tiếp theo"
            data-en-aria-label="Scroll to the next section"
          >
            <span data-scroll-cue-label data-vi="CUỘN XUỐNG" data-en="SCROLL DOWN"
              >CUỘN XUỐNG</span
            >
          </button>
        </section>

        <section
          class="masonry-section"
          id="du-an"
          aria-label="Ảnh sản phẩm quảng cáo"
          data-en-aria-label="Advertising product photos"
          data-header-tone="ink"
        >
          <div class="project-grid" data-project-grid>
            <noscript>
              <figure class="masonry-static-card"><a href="/vi/advertising-products/standee-ke-trung-bay/" data-en-href="/en/advertising-products/displays-booths/"><div class="masonry-static-card__media"><img src="/assets/content/projects/advertising-kiosk-posm-cover-v2-audit-a015-v3.webp" width="3072" height="2048" loading="lazy" decoding="async" alt="Kiosk trưng bày kẹo dừa và kẹo chuối với vách lá nhiệt đới trong trung tâm thương mại" data-en-alt="A coconut and banana sweets kiosk with a tropical leaf backdrop in a shopping mall" /></div></a></figure>
              <figure class="masonry-static-card"><a href="/vi/advertising-products/xe-ban-hang-luu-dong/" data-en-href="/en/advertising-products/mobile-retail/"><div class="masonry-static-card__media"><img src="/assets/content/projects/advertising-mobile-retail-cover-v2-audit-a017-v2.webp" width="3072" height="2048" loading="lazy" decoding="async" alt="Xe bán hàng lưu động đã hoàn thiện" data-en-alt="Completed mobile retail cart" /></div></a></figure>
              <figure class="masonry-static-card"><a href="/vi/advertising-products/bang-hieu-quang-cao/" data-en-href="/en/advertising-products/signage/"><div class="masonry-static-card__media"><img src="/assets/content/projects/signage-dusk-v2-audit-a356-v3.webp" width="3072" height="2048" loading="lazy" decoding="async" alt="Mặt tiền cửa hàng thời trang nam với bảng hiệu trên mặt dựng đá đen" data-en-alt="Menswear storefront with signage on a black stone facade" /></div></a></figure>
              <figure class="masonry-static-card"><a href="/vi/advertising-products/bien-van-phong/" data-en-href="/en/advertising-products/office-signs/"><div class="masonry-static-card__media"><img src="/assets/content/projects/advertising-office-wayfinding-cover-v2.webp" width="3072" height="2048" loading="lazy" decoding="async" alt="Hệ biển văn phòng và chỉ dẫn" data-en-alt="Office signs and wayfinding system" /></div></a></figure>
              <figure class="masonry-static-card"><a href="/vi/advertising-products/man-hinh-bang-led/" data-en-href="/en/advertising-products/led-displays/"><div class="masonry-static-card__media"><img src="/assets/content/projects/advertising-led-lightboxes-cover-v2-audit-a016-v2.webp" width="3072" height="2048" loading="lazy" decoding="async" alt="Màn hình LED và hộp đèn tại điểm bán" data-en-alt="LED display and light boxes at a point of sale" /></div></a></figure>
              <figure class="masonry-static-card"><a href="/vi/advertising-products/in-an-decal/" data-en-href="/en/advertising-products/printing-decals/"><div class="masonry-static-card__media"><img src="/assets/content/projects/advertising-print-decals-cover.webp" width="3072" height="2048" loading="lazy" decoding="async" alt="Ấn phẩm và decal tại xưởng in" data-en-alt="Print collateral and decals in the workshop" /></div></a></figure>
            </noscript>
            <div
              class="masonry-grid__cta-skeleton"
              data-masonry-cta-skeleton
              data-skeleton-ratios="landscape:0.72 square:1 portrait:1.32 wide:0.5"
              aria-hidden="true"
            ></div>
          </div>
          <section
            class="detail-cta"
            data-masonry-grid-cta
            aria-labelledby="cta-title"
            data-header-tone="ink"
          >
            <div class="detail-cta__copy">
              <h2 id="cta-title" data-motion-lines>
                <span data-motion-line-source data-en="The next mark">Dấu ấn tiếp theo</span>
                <span data-motion-line-source data-en="for your brand">dành cho thương hiệu của bạn</span>
              </h2>
              <a
                class="legacy-link"
                href="https://zalo.me/0949131050"
                target="_blank"
                rel="noreferrer"
                data-motion-fade
                data-motion-delay="0.3"
              >
                <span class="portal-subtitle" data-en="Discuss an idea">Trao đổi ý tưởng</span>
              </a>
            </div>
          </section>
        </section>

        <section
          class="detail-view"
          data-detail-view
          data-detail-layout="stacked"
          data-header-tone="ink"
          aria-label="Chi tiết ảnh sản phẩm quảng cáo"
          data-en-aria-label="Advertising product photo details"
          hidden
        >
          <div class="detail-view__canvas" data-detail-canvas>
            <div class="detail-view__primary" data-detail-primary>
              <figure class="detail-view__hero" data-detail-hero>
                <div class="detail-view__hero-frame">
                  <img data-detail-background src="/assets/content/projects/advertising-print-decals-cover-960.webp" alt="" aria-hidden="true" loading="lazy" decoding="async" />
                  <img
                    data-detail-image
                    src="/assets/content/projects/advertising-print-decals-cover-960.webp"
                    width="960"
                    height="640"
                    loading="lazy"
                    decoding="async"
                    alt=""
                  />
                  <video data-detail-video playsinline muted loop preload="metadata" hidden></video>
                  <div class="video-player" data-detail-player hidden>
                    <button
                      class="video-player__surface"
                      type="button"
                      data-detail-play-surface
                      aria-label="Tạm dừng hoặc phát video"
                      data-en-aria-label="Pause or play video"
                    ></button>
                    <div class="video-player__bar">
                      <button
                        class="video-player__button"
                        type="button"
                        data-detail-play
                        aria-label="Tạm dừng"
                        data-en-aria-label="Pause"
                      >
                        <svg class="video-player__icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" /></svg>
                        <svg class="video-player__icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zm9 0a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1z" /></svg>
                      </button>
                      <span class="video-player__time"><span data-detail-time-current>0:00</span> <span class="video-player__total">/ <span data-detail-time-total>0:00</span></span></span>
                      <input
                        class="video-player__range video-player__progress"
                        type="range"
                        min="0"
                        max="1"
                        step="any"
                        value="0"
                        data-detail-progress
                        aria-label="Tua video"
                        data-en-aria-label="Seek video"
                      />
                      <div class="video-player__volume" data-detail-volume-group>
                        <div class="video-player__volume-pop">
                          <input
                            class="video-player__range video-player__volume-range"
                            type="range"
                            min="0"
                            max="1"
                            step="0.05"
                            value="0"
                            data-detail-volume
                            aria-label="Âm lượng"
                            data-en-aria-label="Volume"
                          />
                        </div>
                        <button
                          class="video-player__button"
                          type="button"
                          data-detail-audio-toggle
                          aria-label="Bật tiếng"
                          data-en-aria-label="Unmute"
                        >
                          <svg class="video-player__icon-sound" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9h4l6-5v16l-6-5H3z" /><path class="video-player__stroke" d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13" /></svg>
                          <svg class="video-player__icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9h4l6-5v16l-6-5H3z" /><path class="video-player__stroke" d="M16 9l6 6M22 9l-6 6" /></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                  <button
                    class="detail-view__media-step detail-view__media-step--prev"
                    type="button"
                    data-detail-media-step="-1"
                    aria-label="Media trước"
                    data-en-aria-label="Previous media"
                    hidden
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 1 5 12l11 11" /></svg>
                  </button>
                  <button
                    class="detail-view__media-step detail-view__media-step--next"
                    type="button"
                    data-detail-media-step="1"
                    aria-label="Media sau"
                    data-en-aria-label="Next media"
                    hidden
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 1l11 11L8 23" /></svg>
                  </button>
                  <button
                    class="detail-view__image-action detail-view__back"
                    type="button"
                    data-detail-back
                    aria-label="Quay lại"
                    data-en-aria-label="Back"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12H4M11 5l-7 7 7 7" /></svg>
                  </button>
                  <button
                    class="detail-view__image-action detail-view__expand"
                    type="button"
                    data-detail-expand
                    aria-haspopup="dialog"
                    aria-controls="detail-dialog"
                    aria-label="Xem lớn hơn"
                    data-en-aria-label="View larger"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
                    </svg>
                  </button>
                </div>
              </figure>
              <div class="detail-view__info" data-detail-info tabindex="0" role="region" aria-label="Thông tin ảnh sản phẩm quảng cáo" data-en-aria-label="Advertising product photo information">
                <nav class="detail-eyebrow detail-breadcrumb" data-detail-category aria-label="Phân loại" data-en-aria-label="Category"></nav>
                <div class="detail-view__description" data-detail-description-box>
                  <div
                    class="detail-view__description-scroll"
                    data-detail-description-scroll
                    tabindex="0"
                    role="group"
                    aria-label="Mô tả ảnh"
                    data-en-aria-label="Photo description"
                  >
                    <p data-detail-description></p>
                  </div>
                  <span class="detail-view__description-bar" data-detail-description-bar aria-hidden="true" hidden></span>
                </div>
                <a
                  class="detail-view__cta"
                  data-detail-cta
                  href="https://zalo.me/0949131050"
                  target="_blank"
                  rel="noreferrer"
                  aria-label="Trao đổi ý tưởng"
                  data-en-aria-label="Discuss an idea"
                >
                  <span data-en="Discuss an idea">Trao đổi ý tưởng</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M6 18 18 6M6 6h12v12" />
                  </svg>
                </a>
              </div>
            </div>
            <section class="detail-view__related" data-detail-related aria-label="Ảnh liên quan" data-en-aria-label="Related photos">
              <div class="detail-view__related-grid" data-detail-related-grid>
                <section
                  class="detail-view__suggestion"
                  data-detail-suggestion
                  data-masonry-suggestion-card
                  data-masonry-item="advertising-suggestion"
                  data-masonry-kind="suggestion"
                  data-masonry-related-item="advertising-suggestion"
                  data-rank="0"
                  data-source-order="0"
                  hidden
                  aria-labelledby="detail-related-title"
                >
                  <h2 id="detail-related-title" data-detail-related-title data-en="You might like">
                    Có thể bạn thích
                  </h2>
                </section>
              </div>
            </section>
          </div>
          <dialog
            class="detail-dialog"
            id="detail-dialog"
            data-detail-dialog
            tabindex="-1"
            aria-labelledby="detail-dialog-title"
          >
            <h2 class="sr-only" id="detail-dialog-title" data-en="Expanded photo">
              Xem ảnh lớn
            </h2>
            <div class="detail-dialog__viewport" data-detail-viewport>
              <img
                data-detail-expanded-image
                src="/assets/content/projects/advertising-print-decals-cover-960.webp"
                width="960"
                height="640"
                loading="lazy"
                decoding="async"
                alt=""
              />
              <div class="detail-dialog__video" data-detail-video-host hidden></div>
            </div>
            <div
              class="detail-view__media-thumbs detail-dialog__thumbs"
              role="group"
              aria-label="Media sản phẩm"
              data-en-aria-label="Product media"
              data-detail-viewer-thumbs
              hidden
            ></div>
            <output class="sr-only" data-detail-zoom-status aria-live="polite">100%</output>
          </dialog>
        </section>
      </main>

      <!-- shell:footer -->
    </div>

    <!-- shell:scripts -->
  </body>
</html>
