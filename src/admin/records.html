<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trường Thịnh CMS - Nội dung</title>
<style>
  :root { --bg:#f5f5f3; --fg:#1d1d1b; --muted:#666; --line:#d6d6d0; --card:#fff; --accent:#1f5fbf; --danger:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  .embed header h1, .embed header a { display:none; }
  header { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 8px 0 0; }
  header .spacer { flex:1; }
  select, input, button, textarea { font:inherit; }
  select, input { padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  button { padding:6px 12px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button.danger { background:var(--danger); border-color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  a { color:var(--accent); }
  #status { margin:0; padding:8px 16px; min-height:2.4em; background:#fffbe6; border-bottom:1px solid var(--line); }
  #status.error { background:#fdecea; color:var(--danger); }
  #status ul { margin:4px 0 0; padding-left:20px; }
  main { display:grid; grid-template-columns:minmax(300px, 380px) 1fr; gap:16px; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; min-width:0; }
  h2 { font-size:16px; margin:0 0 8px; }
  #list { list-style:none; margin:0; padding:0; }
  #list li { padding:8px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list li:hover, #list li.active { background:#eaf1fc; }
  #list .meta { color:var(--muted); font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
  #editorMeta { color:var(--muted); }
  #json { width:100%; min-height:420px; font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; padding:8px; border:1px solid var(--line); border-radius:4px; resize:vertical; }
  details { margin:0 16px 24px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 12px; }
  summary { cursor:pointer; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:13px; display:block; overflow-x:auto; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  [hidden] { display:none !important; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Trường Thịnh CMS - Nội dung</h1>
  <label>Loại <select id="typeSelect"></select></label>
  <label>Trạng thái
    <select id="statusFilter">
      <option value="">Tất cả</option>
      <option value="draft">Nháp</option>
      <option value="published">Đã đăng</option>
      <option value="trashed">Thùng rác</option>
    </select>
  </label>
  <span class="spacer"></span>
  <a href="./status.html">Vận hành</a>
  <a href="./">Editor Dockview</a>
</header>
<p id="status" role="status" aria-live="polite"></p>
<main>
  <section id="listPane">
    <h2>Danh sách</h2>
    <div class="row"><button id="newBtn" type="button">Tạo mới</button></div>
    <ul id="list"></ul>
    <div class="row"><button id="moreBtn" type="button" class="secondary" hidden>Tải thêm</button></div>
  </section>
  <section id="editorPane">
    <h2>Chỉnh sửa</h2>
    <div id="editorMeta">Chưa mở bản ghi nào.</div>
    <div class="row" id="createRow" hidden>
      <span>Mã mới: <strong id="createId"></strong></span>
      <button id="createBtn" type="button">Tạo</button>
    </div>
    <textarea id="json" spellcheck="false" aria-label="Dữ liệu JSON"></textarea>
    <div class="row">
      <button id="saveBtn" type="button">Lưu</button>
      <button id="trashBtn" type="button" class="danger">Đưa vào thùng rác</button>
      <button id="restoreBtn" type="button" class="secondary" hidden>Khôi phục</button>
      <button id="purgeBtn" type="button" class="danger" hidden>Xóa hẳn</button>
      <button id="downloadBtn" type="button" class="secondary" hidden>Tải JSON của tôi</button>
      <button id="reloadBtn" type="button" class="secondary" hidden>Tải bản mới</button>
    </div>
  </section>
</main>
<details id="auditBox">
  <summary>Nhật ký</summary>
  <table>
    <thead><tr><th>seq</th><th>at</th><th>email</th><th>command</th><th>type</th><th>id</th><th>result</th></tr></thead>
    <tbody id="auditBody"></tbody>
  </table>
  <div class="row"><button id="auditMore" type="button" class="secondary" hidden>Tải thêm</button></div>
</details>
<script type="module" src="./records.js"></script>
</body>
</html>
