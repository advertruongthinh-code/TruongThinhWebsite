<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Trường Thịnh CMS</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <p>Trường Thịnh</p>
        <h1>Quản trị nội dung</h1>
        <p class="admin-note">Cloudflare Access bảo vệ khu vực này. Nội dung là trường dữ liệu cố định, không nhận HTML tự do.</p>
      </header>

      <nav class="admin-nav" aria-label="Nội dung quản trị">
        <button type="button" data-resource="pages" aria-pressed="true">Trang</button>
        <button type="button" data-resource="projects" aria-pressed="false">Công trình</button>
        <button type="button" data-resource="products" aria-pressed="false">Sản phẩm</button>
        <button type="button" data-resource="project-categories" aria-pressed="false">Nhóm công trình</button>
        <button type="button" data-resource="product-categories" aria-pressed="false">Nhóm sản phẩm</button>
        <button type="button" data-resource="settings" aria-pressed="false">Thiết lập</button>
      </nav>

      <p class="admin-status" id="status" role="status" aria-live="polite"></p>

      <section class="admin-workspace" aria-label="Biên tập nội dung">
        <aside class="records-panel">
          <div class="panel-heading">
            <h2 id="records-title">Trang</h2>
            <button type="button" class="button button--quiet" id="new-record">Tạo mới</button>
          </div>
          <div id="records" class="records-list"></div>
        </aside>

        <section class="editor-panel" aria-labelledby="editor-title">
          <h2 id="editor-title">Chọn một mục để biên tập</h2>
          <form id="editor" hidden>
            <div id="fields" class="form-grid"></div>
            <div class="form-actions">
              <button class="button" type="submit">Lưu</button>
              <button class="button button--danger" id="delete-record" type="button">Xoá</button>
            </div>
          </form>
        </section>
      </section>

      <section class="media-panel" aria-labelledby="media-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Tài nguyên riêng tư</p>
            <h2 id="media-title">Tải ảnh</h2>
          </div>
          <button class="button button--quiet" id="refresh-media" type="button">Làm mới</button>
        </div>
        <form id="media-form" class="media-form">
          <label>File WebP hoặc logo SVG an toàn <input name="file" type="file" accept="image/webp,image/svg+xml" required /></label>
          <label>Loại <select name="kind"><option value="image">Ảnh WebP</option><option value="logo">Logo SVG</option></select></label>
          <label>Alt tiếng Việt <input name="alt_vi" autocomplete="off" /></label>
          <label>Alt tiếng Anh <input name="alt_en" autocomplete="off" /></label>
          <button class="button" type="submit">Tải lên</button>
        </form>
        <div id="media-list" class="media-list"></div>
      </section>
    </main>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
