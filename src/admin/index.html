<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Trường Thịnh CMS</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./vendor/dockview.css" />
    <link rel="stylesheet" href="./editor.css" />
    <script src="./vendor/dockview.min.js"></script>
    <script src="./cms-core.js"></script>
    <script type="module" src="./editor.js"></script>
  </head>
  <body>
    <header class="topbar">
      <strong class="topbar__brand">Trường Thịnh CMS</strong>
      <span class="topbar__page" id="page-label">Đang tải</span>
      <span class="topbar__status" id="draft-status" role="status" aria-live="polite"></span>
      <span class="topbar__spacer"></span>
      <button type="button" id="undo" title="Hoàn tác thao tác cuối">Hoàn tác</button>
      <button type="button" id="export" title="Tải bản nháp trang này về máy">Xuất JSON</button>
      <details class="topbar__menu">
        <summary>Bảng</summary>
        <div id="panel-menu"></div>
      </details>
      <button type="button" class="is-primary" id="save">Lưu</button>
    </header>
    <main class="dock" id="dock"></main>
    <p class="narrow">Mở CMS trên máy tính, cửa sổ rộng từ 1024px.</p>
    <p class="toast" id="toast" role="alert" hidden></p>
  </body>
</html>
