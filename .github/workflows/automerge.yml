name: Automerge

# Tự merge PR khi CI và Docs cùng xanh, không cần agent. Mặc định bật; giữ PR lại bằng
# draft hoặc nhãn `hold`. Chỉ đọc metadata, không checkout code của PR.
on:
  workflow_run:
    workflows: [CI, Docs]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const required = ['static-release', 'qa-docs'];
            for (const { number } of context.payload.workflow_run.pull_requests) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== sha) continue;
              if (pr.labels.some((label) => label.name === 'hold')) {
                core.info(`PR #${number}: nhãn hold, giữ lại.`);
                continue;
              }
              const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha });
              const green = required.every((name) =>
                runs.some((run) => run.name === name && run.conclusion === 'success'));
              if (!green) {
                core.info(`PR #${number}: chưa đủ check xanh (${required.join(', ')}).`);
                continue;
              }
              // Ruleset trả 405 "Required status check ... is expected" khi check vừa xanh (re-run) chưa
              // kịp ghi nhận: thử lại với backoff 10s, 20s, 40s (tổng 70s, dưới timeout 5 phút của job).
              let merged = false;
              for (let attempt = 0; attempt < 4 && !merged; attempt++) {
                try {
                  await github.rest.pulls.merge({ owner, repo, pull_number: number, sha, merge_method: 'merge' });
                  merged = true;
                } catch (error) {
                  if (error.status === 405 && /status check/i.test(error.message) && attempt < 3) {
                    core.info(`PR #${number}: ruleset chưa ghi nhận check, thử lại lần ${attempt + 1}/3.`);
                    await new Promise((resolve) => setTimeout(resolve, 10000 * 2 ** attempt));
                    continue;
                  }
                  // Conflict hoặc PR đã được run song song merge: để thread xử lý.
                  core.warning(`PR #${number}: không merge được: ${error.message}`);
                  break;
                }
              }
              if (!merged) continue;
              core.info(`PR #${number}: đã merge.`);
              // Merge bằng GITHUB_TOKEN không kích hoạt xóa branch tự động của repo (kiểm 18/10), nên xóa tay.
              if (pr.head.repo.full_name === `${owner}/${repo}` && pr.head.ref !== pr.base.ref
                  && pr.head.ref !== context.payload.repository.default_branch) {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` })
                  .catch((error) => core.warning(`PR #${number}: không xóa được branch: ${error.message}`));
              }
              // Merge bằng GITHUB_TOKEN không kích hoạt CI push; dispatch tay để Deploy demo chạy tiếp.
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'ci.yml', ref: pr.base.ref,
              });
            }
