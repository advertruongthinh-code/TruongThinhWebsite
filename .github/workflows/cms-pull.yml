# CMS pull (cms-plan J2): downloads the D1 snapshot projected to content files as an artifact. A thread copies them
# into src/site/content/ and opens a normal PR; no commit here, a PR made with GITHUB_TOKEN would not trigger CI.
# CMS_MEDIA_ORIGIN stays unset, so R2 image src keeps the relative /v/... form stored in D1; a repo build of such an image
# also needs variants.json. The artifact is all of src/site/content/ with the projected files written over it.
name: CMS pull
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/cms/fetch-snapshot.mjs --out "$PWD/.tmp/snapshot/content"
        env:
          CMS_SNAPSHOT_URL: ${{ vars.CMS_ADMIN_ORIGIN }}/api/admin/snapshot
          CMS_ACCESS_CLIENT_ID: ${{ secrets.CMS_ACCESS_CLIENT_ID }}
          CMS_ACCESS_CLIENT_SECRET: ${{ secrets.CMS_ACCESS_CLIENT_SECRET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cms-content
          path: .tmp/snapshot/content/
          include-hidden-files: true
          retention-days: 7
