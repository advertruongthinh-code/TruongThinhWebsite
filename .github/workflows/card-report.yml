name: Card report

# notion.md rule 9: each night list PRs merged in the last 24 hours without a Notion card link; red means the coordinator backfills.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  card-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/ci/card-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
