name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Automerge dispatch CI trên main sau khi merge, vì merge bằng GITHUB_TOKEN không kích hoạt push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bộ test theo phần website (docs/specs/ci-test-suites.md): chọn bộ, chạy song song, gom thành check static-release.
jobs:
  select:
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      # Checkout của PR là merge commit: HEAD^1 là main, nên diff HEAD^1...HEAD là đúng phần PR sửa.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: select
        run: echo "suites=$(node scripts/ci/suites.mjs --select --event "$GITHUB_EVENT_NAME" --base HEAD^1)" >> "$GITHUB_OUTPUT"

  suite:
    needs: select
    if: needs.select.outputs.suites != '[]'
    name: ${{ matrix.suite }}
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7

      # dest riêng mỗi runner: các instance cùng user dùng chung ~/setup-pnpm nên self-install đè nhau. Đặt trong
      # tool cache (giữ qua các job, khác runner.temp bị xóa sau mỗi job) để pnpm và store của nó không tải lại; vì
      # store nằm sẵn trên máy nên bỏ cache pnpm của setup-node (tải 42 MB từ GitHub mất khoảng 40 giây mỗi job).
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Script e2e tự đặt browser path về .tooling/browsers khi env trống; trỏ mọi bước về cache của playwright install.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install chromium

      # Script tự build, mở preview ở port trống riêng (các runner trên cùng PC dùng chung network) và dọn server.
      - run: pnpm qa:suite ${{ matrix.suite }}

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-failure-${{ matrix.suite }}
          path: |
            static-server.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Automerge và Deploy demo đọc check này; bộ không được chọn (skipped) không tính là đỏ.
  static-release:
    needs: [select, suite]
    if: always()
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 5
    steps:
      - run: |
          echo "select=${{ needs.select.result }} suites=${{ needs.select.outputs.suites }} result=${{ needs.suite.result }}"
          [ "${{ needs.select.result }}" = success ] || exit 1
          case "${{ needs.suite.result }}" in success|skipped) ;; *) exit 1 ;; esac
