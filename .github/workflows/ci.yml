name: CI

on:
  pull_request:
    # PR nháp chỉ chạy bộ fast; chuyển sang sẵn sàng (ready_for_review) thì chạy đủ bộ được chọn.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Automerge dispatch CI trên main sau khi merge, vì merge bằng GITHUB_TOKEN không kích hoạt push.
  workflow_dispatch:

permissions:
  contents: read

# Push mới hủy lượt cũ của cùng PR; trên main không hủy để lượt đã chạy dở vẫn tới Deploy demo khi merge dồn dập.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Bộ test theo phần website (docs/specs/ci-test-suites.md): chọn bộ, chạy song song, gom thành check static-release.
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      # Checkout của PR là merge commit: HEAD^1 là main, nên diff HEAD^1...HEAD là đúng phần PR sửa.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - id: select
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          suites=$(node scripts/ci/suites.mjs --select --event "$GITHUB_EVENT_NAME" --base HEAD^1)
          if [ "$DRAFT" = true ] && [ "$suites" != "[]" ]; then suites='["fast"]'; fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  suite:
    needs: select
    if: needs.select.outputs.suites != '[]'
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Script e2e tự đặt browser path về .tooling/browsers khi env trống; trỏ mọi bước về cache của playwright install.
      # Runner GitHub-hosted trắng mỗi job nên cài Chromium cùng system deps.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      # Bộ adv-browse chạy thêm WebKit (random-browse); các bộ khác chỉ Chromium.
      - run: pnpm exec playwright install --with-deps chromium ${{ matrix.suite == 'adv-browse' && 'webkit' || '' }}

      # Script tự build, mở preview ở port trống riêng và dọn server.
      - run: pnpm qa:suite ${{ matrix.suite }}

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-failure-${{ matrix.suite }}
          # Test e2e ghi report và screenshot vào .tmp/; thư mục ẩn cần include-hidden-files.
          path: |
            static-server.log
            test-results/
            .tmp/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Automerge và Deploy demo đọc check này; bộ không được chọn (skipped) không tính là đỏ. Lượt PR nháp đổi tên
  # check để Automerge không merge bằng kết quả chỉ có bộ fast. Cả lượt bị hủy (push mới, PR rời nháp) thì job skipped
  # thay vì đỏ; Automerge chỉ nhận success nên skipped không merge được.
  static-release:
    name: ${{ github.event.pull_request.draft && 'static-release-draft' || 'static-release' }}
    needs: [select, suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "select=${{ needs.select.result }} suites=${{ needs.select.outputs.suites }} result=${{ needs.suite.result }}"
          [ "${{ needs.select.result }}" = success ] || exit 1
          case "${{ needs.suite.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # Deploy demo chỉ chạy trên main (push hoặc dispatch của Automerge) khi static-release xanh.
  deploy-demo:
    needs: static-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-demo.yml
    secrets: inherit
