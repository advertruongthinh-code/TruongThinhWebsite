name: CI

on:
  pull_request:
    # Draft PRs run only the fast suite; moving to ready (ready_for_review) runs the full selected suites.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Automerge dispatches CI on main after merging, because a merge by GITHUB_TOKEN does not trigger push.
  # A manual dispatch with full: true runs the full suites like the nightly run.
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
  # The full suites run nightly at 02:00 Vietnam time; PRs and pushes run only fast (spec ci-test-suites R4).
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

# A new push cancels the older run of the same PR; on main nothing is cancelled so a run in progress still reaches Deploy demo when merges pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Test suites per website part (docs/specs/ci-test-suites.md): select suites, run in parallel, aggregate into the static-release check.
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      # The PR checkout is a merge commit: HEAD^1 is main, so the diff HEAD^1...HEAD is exactly what the PR changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - id: select
        env:
          FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
        run: |
          suites=$(node scripts/ci/suites.mjs --select --event "$GITHUB_EVENT_NAME" --base HEAD^1)
          if [ "$FULL" = true ]; then suites=$(node scripts/ci/suites.mjs --all)
          elif [ "$suites" != "[]" ]; then suites='["fast"]'; fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  suite:
    needs: select
    if: needs.select.outputs.suites != '[]'
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # E2E scripts set the browser path to .tooling/browsers themselves when the env is empty; point every step at the playwright install cache.
      # GitHub-hosted runners are blank per job, so install Chromium with system deps.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      # The adv-browse suite also runs WebKit (random-browse); the other suites run Chromium only.
      # The ubuntu-latest runner already has most system libraries, so only download the browser (CDN, a few seconds);
      # apt runs only when the browser cannot open. Do not use --with-deps: apt-get update from the Azure mirror
      # once hung for 11 minutes (PR 581), and a timeout run as a normal user cannot kill apt run via sudo.
      - name: Install browsers
        env:
          BROWSERS: ${{ matrix.suite == 'adv-browse' && 'chromium webkit' || 'chromium' }}
        run: |
          pnpm exec playwright install $BROWSERS
          probe() { for b in $BROWSERS; do node -e "require('playwright').$b.launch().then(x => x.close())" || return 1; done; }
          probe || {
            sudo env "PATH=$PATH" timeout -k 10 240 node_modules/.bin/playwright install-deps $BROWSERS
            probe
          }

      # The script builds itself, opens a preview on its own free port and cleans up the server.
      - run: pnpm qa:suite ${{ matrix.suite }}

      # Per-command timings (spec R10) to pack jobs and rank flaky tests; upload even when green.
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: suite-timing-${{ matrix.suite }}
          path: .tmp/suite-timing.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-failure-${{ matrix.suite }}
          # E2E tests write reports and screenshots to .tmp/; hidden folders need include-hidden-files.
          path: |
            static-server.log
            test-results/
            .tmp/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Automerge and Deploy demo read this check; suites that are not selected (skipped) do not count as red. The draft PR run renames
  # the check so Automerge does not merge on a result that covers only the fast suite. If the whole run is cancelled (new push, PR leaves draft) the job is skipped
  # instead of red; Automerge accepts only success, so skipped cannot merge.
  static-release:
    name: ${{ github.event.pull_request.draft && 'static-release-draft' || 'static-release' }}
    needs: [select, suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "select=${{ needs.select.result }} suites=${{ needs.select.outputs.suites }} result=${{ needs.suite.result }}"
          [ "${{ needs.select.result }}" = success ] || exit 1
          case "${{ needs.suite.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # Deploy demo runs only on main (push or Automerge dispatch) when static-release, i.e. the fast suite, is green; the nightly run does not deploy.
  deploy-demo:
    needs: static-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule' && inputs.full != true
    uses: ./.github/workflows/deploy-demo.yml
    secrets: inherit
