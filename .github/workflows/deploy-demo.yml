name: Deploy demo

# Deploy the demo (= staging.truongthinhads.vn) when CI is green on main, or the live site from release.yml
# (docs/specs/static-release.md R11). Called by ci.yml (job deploy-demo) instead of workflow_run: a CI run dispatched
# by Automerge with GITHUB_TOKEN does not trigger workflow_run, so the demo used to miss updates after auto-merged PRs.
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: staging

permissions:
  contents: read

# One queue per target, so a staging deploy never replaces a pending production release.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ inputs.target == 'production' && 'release:site' || 'deploy:demo' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
