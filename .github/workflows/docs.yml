name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      # build-design-system --check ghép CSS Swiper đã pin trong node_modules (spec design-system R3).
      - run: pnpm install --frozen-lockfile
      # Script đọc mô tả PR qua API lúc chạy, nên re-run sau khi sửa mô tả PR đọc bản mới.
      - run: node scripts/docs/check-docs.mjs
        env:
          # PR Dependabot chỉ nâng version action, không đổi spec: bỏ sync.
          DOCS_BASE: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.base.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
