name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-docs:
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Body đi qua env, không bao giờ nội suy vào script.
      - run: node scripts/docs/check-docs.mjs
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
          # PR Dependabot chỉ nâng version action, không đổi spec.
          PR_BODY: "${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'Spec: không đổi - Dependabot' || github.event.pull_request.body }}"
