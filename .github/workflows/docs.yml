name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Script đọc mô tả PR qua API lúc chạy, nên re-run sau khi sửa mô tả PR đọc bản mới.
      - run: node scripts/docs/check-docs.mjs
        env:
          # PR Dependabot chỉ nâng version action, không đổi spec: bỏ sync.
          DOCS_BASE: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.base.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
