name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      # build-design-system --check assembles the pinned Swiper CSS from node_modules (spec design-system R3).
      - run: pnpm install --frozen-lockfile
      # The script reads the PR description through the API at run time, so a re-run after editing the PR description reads the new text.
      - run: node scripts/docs/check-docs.mjs
        env:
          # Dependabot PRs only bump action versions, not specs: skip sync.
          DOCS_BASE: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.base.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
