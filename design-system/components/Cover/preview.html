<!-- @dsCard height=320 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap">
<div style="position: relative; width: 960px; height: 320px; overflow: hidden; background: var(--paper); font-family: var(--font-sans);">
<svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true" style="position: absolute; inset: 0;">
<!--
blocks: ink 180x320 (2 x section-gap wide, full height), blue 105x105 (3 x gutter), orange 70x70 (2 x gutter); square corners.
arrangement: one tall ink slab with two satellites bleeding off the top and right edges.
pattern: editorial, "khung vuông, mặt phẳng, không đổ bóng" -> four hairline rules in line crossing the blocks.
scales: gutter 35, section-gap 90, square corners, line hairline 1px.
-->
<rect x="620" y="0" width="180" height="320" fill="var(--ink)"/>
<rect x="855" y="0" width="105" height="105" fill="var(--blue)"/>
<rect x="800" y="215" width="70" height="70" fill="var(--orange)"/>
<line x1="480" y1="105" x2="960" y2="105" stroke="var(--line)" stroke-width="1"/>
<line x1="480" y1="215" x2="960" y2="215" stroke="var(--line)" stroke-width="1"/>
<line x1="585" y1="0" x2="585" y2="320" stroke="var(--line)" stroke-width="1"/>
<line x1="835" y1="0" x2="835" y2="320" stroke="var(--line)" stroke-width="1"/>
</svg>
<div style="position: absolute; left: 35px; bottom: 35px; max-width: 440px;">
<div style="font-size: 96px; font-weight: 600; line-height: 0.95; letter-spacing: 0.001px; color: var(--ink);">Trường<br>Thịnh</div>
<p style="margin: 14px 0 0; font-size: 14px; font-weight: 500; color: var(--muted);">Công trình lên tiếng.</p>
</div>
</div>
