# Admin Worker of the CMS (docs/specs/cms.md R1). Deployed only after the owner approves the Storage slice.
name = "truong-thinh-admin"
main = "src/worker/index.js"
compatibility_date = "2026-07-31"
workers_dev = false
preview_urls = false

# The only admin URL: the user and machine Access apps cover this hostname (docs/specs/cms-data.md R4).
[[routes]]
pattern = "admin.truongthinhads.vn"
custom_domain = true

[assets]
directory = ".site-output"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "truong-thinh-cms"
database_id = "a98c6483-b503-4829-8da9-03bbd2a0eeda"
migrations_dir = "src/db/migrations"

# The daily D1 export (src/worker/backup.mjs) calls the REST API with this id; keep it equal to database_id above.
[vars]
D1_DATABASE_ID = "a98c6483-b503-4829-8da9-03bbd2a0eeda"

[[r2_buckets]]
binding = "MEDIA_ORIGINALS"
bucket_name = "truong-thinh-media-originals"

[[r2_buckets]]
binding = "MEDIA_PUBLIC"
bucket_name = "truong-thinh-media-public"

[[ratelimits]]
name = "ADMIN_WRITE_LIMIT"
namespace_id = "7311"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ADMIN_UPLOAD_LIMIT"
namespace_id = "7312"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["* * * * *"]

# Logs only: traces would record the signed URL of the D1 dump (src/worker/backup.mjs).
[observability]
enabled = true
