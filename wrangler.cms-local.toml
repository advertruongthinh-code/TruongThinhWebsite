# CMS chạy local: chỉ dùng với `pnpm cms:dev`, không deploy file này.
# D1 và R2 là bản giả lập trong `.wrangler/`, không có tài nguyên Cloudflare thật.
name = "truong-thinh-cms-local"
main = "src/worker/index.js"
compatibility_date = "2026-07-31"

[assets]
directory = ".site-output"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [
  "/",
  "/index.html",
  "/vi",
  "/vi/*",
  "/en",
  "/en/*",
  "/nha-o*",
  "/kinh-doanh*",
  "/quang-cao*",
  "/gioi-thieu*",
  "/residential*",
  "/commercial*",
  "/advertising-products*",
  "/projects-products*",
  "/about*",
  "/api/*",
  "/media/*",
  "/robots.txt",
  "/sitemap.xml",
]

[[d1_databases]]
binding = "DB"
database_name = "truong-thinh-cms-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "truong-thinh-media-local"

[vars]
# Đăng nhập admin dev, Worker chỉ nhận khi host là loopback (R5).
CMS_LOCAL_ADMIN_EMAIL = "admin@localhost"
